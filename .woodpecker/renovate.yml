# .woodpecker/renovate.yml
# Renovate bot - scans GitHub repo and creates PRs for dependency updates
# Runs on cron schedule only (configure in Woodpecker: weekly on Mondays)

# Renovate runtime verified on 2026-10-23: Node 24.22.1 (amd64/arm64).
# Refresh manually after review: Renovate currently manages Python only.

when:
  event: cron

steps:
  - name: renovate
    image: renovate/renovate:44.181.0@sha256:1a06e15f2d8bc08342828ec43c0a90de0ac9192900f513af90e77765e0991b6d
    environment:
      RENOVATE_TOKEN:
        from_secret: github_pat
      RENOVATE_PLATFORM: github
      RENOVATE_REPOSITORIES: jlipworth/jl-lseg-toolkit
      RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate@noreply.github.com>"
      LOG_LEVEL: info
    commands:
      - node --version
      - renovate

  - name: notify-renovate
    image: appleboy/drone-discord:latest@sha256:476966c0b54fa5fe624ff08f90022b3b90f652bcc00918b0c7a14012de55994d
    depends_on:
      - renovate
    settings:
      webhook_id:
        from_secret: discord_id
      webhook_token:
        from_secret: discord_token
      message: >
        Renovate completed for {{repo.name}}
        Check for new dependency update PRs
        {{build.link}}
